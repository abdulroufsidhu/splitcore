name: splitcore_sdk
description: >
  Dart SDK wrapping the splitcore FFI library (split/settlement/balance math)
  and PocketBase communication for expense-splitting clients.
version: 0.2.0
repository: https://github.com/abdulroufsidhu/splitcore
issue_tracker: https://github.com/abdulroufsidhu/splitcore/issues
documentation: https://github.com/abdulroufsidhu/splitcore/blob/master/splitcore_sdk/README.md
topics:
  - ffi
  - expenses
  - pocketbase

environment:
  sdk: ^3.9.0

dependencies:
  ffi: ^2.1.3
  pocketbase: ^0.22.0
  sqlite3: ^2.4.0
  http: ^1.2.0
  image: ^4.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  path: ^1.9.0
